<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端聊天室-全内置版</title>
    <style>
        body { font-family: sans-serif; background: #e7ebf0; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #517da2; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: white; padding: 10px; border-radius: 10px; align-self: flex-start; max-width: 75%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg.me { background: #effdde; align-self: flex-end; }
        footer { background: white; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; border: 1px solid #ccc; padding: 10px 15px; border-radius: 20px; outline: none; }
        button { background: #517da2; color: white; border: none; padding: 0 20px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <header id="status">🌐 正在启动本地云端引擎...</header>
    <div id="chat"></div>
    <footer>
        <input id="ipt" placeholder="输入消息..." autocomplete="off">
        <button onclick="sendMsg()">发送</button>
    </footer>
    <script>
(function(global, factory) {
    typeof exports === 'object' && typeof module !== 'undefined' ? factory(exports) :
    typeof define === 'function' && define.amd ? define(['exports'], factory) :
    (factory((global.supabase = {})));

    var __defNormalProp = (obj, key, value) => key in obj ? __defProp(obj, key, { enumerable: true, configurable: true, writable: true, value }) : obj[key] = value;
    var __spreadValues = (a, b) => {

        if (__getOwnPropSymbols) for (var prop of __getOwnPropSymbols(b)) if (__propIsEnum.call(b, prop)) __defNormalProp(a, prop, b[prop]);
        return a;

    var __spreadProps = (a, b) => __defProps(a, __getOwnPropDescs(b));

    // 存储管理
    class StorageHelpers {
        static getItem(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
        static setItem(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
    }

    exports.createClient = function(supabaseUrl, supabaseKey, options) {
        return new SupabaseClient(supabaseUrl, supabaseKey, options);
    };

    class SupabaseClient {
        constructor(supabaseUrl, supabaseKey, options) {
            this.supabaseUrl = supabaseUrl;
            this.supabaseKey = supabaseKey;
            this.auth = new AuthClient(supabaseUrl, supabaseKey);
            this.realtime = new RealtimeClient(supabaseUrl, supabaseKey);
        }
        from(table) {
            return new QueryBuilder(this.supabaseUrl, this.supabaseKey, table);
        }
        channel(name) {
            return this.realtime.channel(name);
        }
    }
    class QueryBuilder {
        constructor(url, key, table) {
            this.url = `${url}/rest/v1/${table}`;
            this.key = key;
        }
        async select(columns = '*') {
            const res = await fetch(`${this.url}?select=${columns}`, {
                headers: { 'apikey': this.key, 'Authorization': `Bearer ${this.key}` }
            });
            const data = await res.json();
            return { data, error: res.ok ? null : data };
        }
        async insert(values) {
            const res = await fetch(this.url, {
                method: 'POST',
                headers: { 
                    'apikey': this.key, 
                    'Authorization': `Bearer ${this.key}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify(values)
            });
            const data = await res.json();
            return { data, error: res.ok ? null : data };
        }
    }

    class AuthClient {
        constructor(url, key) { this.url = url; this.key = key; }
    }

    class RealtimeClient {
        constructor(url, key) {
            this.url = url.replace('http', 'ws') + '/realtime/v1';
            this.key = key;
        }
        channel(name) {
            return {
                on: (type, filter, callback) => {
                    // 简化的监听逻辑：每3秒自动拉取一次实现“伪实时”
                    // 这样可以绕过复杂的 WebSocket 网络封锁
                    setInterval(async () => {
                        const res = await fetch(`${URL}/rest/v1/messages?order=created_at.desc&limit=1`, {
                            headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` }
                        });
                        const data = await res.json();
                        if (data && data[0]) callback({ new: data[0] });
                    }, 3000);
                    return { subscribe: () => {} };
                }
            };
        }
    }
})));
    // --- 5. 你的专属配置 ---
    const URL = 'https://supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6Z3lxeWdyeWVhbGlmbnhpbmprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjk4MzcsImV4cCI6MjA5MzgwNTgzN30.2_coqJbBl95QcnollMK2F2JSPJXexIkwy4rpiaH8EYc';

    // 初始化客户端
    const _s = supabase.createClient(URL, KEY);
    let user, lastId = null;

    // 启动程序
    async function init() {
        user = localStorage.getItem('chat_u') || prompt("云端连接成功！请输入聊天昵称") || "访客";
        localStorage.setItem('chat_u', user);
        document.getElementById('status').innerText = "✅ 云端已连接 | 昵称: " + user;
        
        // 第一次加载历史消息
        await loadMessages();
        
        // 开启自动同步（每3秒检查一次新消息）
        setInterval(loadMessages, 3000);
    }

        async function loadMessages() {
        const { data, error } = await _s.from('messages').select('*').order('created_at', { ascending: true });
        if (error) return;
        
        const chatBox = document.getElementById('chat');
        
        // 关键修复：直接对比内容和时间，确保新消息一定能弹出来
        data.forEach(m => {
            // 使用消息内容和时间的组合作为唯一标识，防止重复
            const msgKey = m.username + m.content + m.created_at;
            if (!window.renderedMsgs) window.renderedMsgs = new Set();
            
            if (!window.renderedMsgs.has(msgKey)) {
                addMessageToScreen(m);
                window.renderedMsgs.add(msgKey);
                lastId = m.id;
            }
        });
    }


    function addMessageToScreen(m) {
        const d = document.createElement('div');
        const isMe = m.username === user;
        d.className = 'msg' + (isMe ? ' me' : '');
        d.innerHTML = `<div style="font-size:10px;color:#3a6d99">${m.username}</div>${m.content}`;
        document.getElementById('chat').appendChild(d);
        document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }

    // 发送功能
    window.sendMsg = async function() {
        const input = document.getElementById('ipt');
        const val = input.value.trim();
        if (!val) return;
        input.value = '';
        
        const { error } = await _s.from('messages').insert([{ username: user, content: val }]);
        if (error) alert("发送失败，请检查网络");
    };

    // 绑定回车
    document.getElementById('ipt').addEventListener('keypress', e => { if(e.key === 'Enter') sendMsg(); });

    init();
    </script>
</body>
</html>
