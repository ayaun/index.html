<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>云端聊天室</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; background: #e7ebf0; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #517da2; color: white; padding: 15px; text-align: center; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: white; padding: 10px; border-radius: 10px; align-self: flex-start; max-width: 70%; }
        footer { background: white; padding: 15px; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <header id="status">连接中...</header>
    <div id="chat"></div>
    <footer>
        <input type="text" id="ipt" placeholder="输入消息...">
        <button onclick="send()">发送</button>
    </footer>

    <script>
        const URL = 'https://supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6Z3lxeWdyeWVhbGlmbnhpbmprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjk4MzcsImV4cCI6MjA5MzgwNTgzN30.2_coqJbBl95QcnollMK2F2JSPJXexIkwy4rpiaH8EYc';
        const _s = supabase.createClient(URL, KEY);
        let user = localStorage.getItem('user') || prompt("请输入昵称") || "访客";
        localStorage.setItem('user', user);

        async function load() {
            const { data, error } = await _s.from('messages').select('*').order('created_at');
            if (error) {
                document.getElementById('status').innerText = "❌ 错误: " + error.message;
            } else {
                document.getElementById('status').innerText = "✅ 已连接: " + user;
                data.forEach(m => add(m));
            }
        }

        function add(m) {
            const d = document.createElement('div');
            d.className = 'msg';
            d.innerText = m.username + ": " + m.content;
            document.getElementById('chat').appendChild(d);
        }

        async function send() {
            const i = document.getElementById('ipt');
            const v = i.value; i.value = '';
            await _s.from('messages').insert([{ username: user, content: v }]);
        }

        _s.channel('m').on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, p => add(p.new)).subscribe();
        load();
    </script>
</body>
</html>
