<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Telegram Pro</title>
    <script>
    /* 核心驱动内置：彻底解决 supabase is not defined 报错 */
    (function(g,f){typeof exports==='object'&&typeof module!=='undefined'?f(exports):typeof define==='function'&&define.amd?define(['exports'],f):(f((g.supabase={})));}(this,(function(exports){'use strict';exports.createClient=function(u,k){return{from:function(t){return{select:function(q){return{eq:function(f,v){return{maybeSingle:function(){return fetch(`${u}/rest/v1/${t}?${f}=eq.${v}&select=*`,{headers:{apikey:k,Authorization:`Bearer ${k}`}}).then(r=>r.json().then(d=>({data:r.ok?d:null,error:r.ok?null:d})))},single:function(){return fetch(`${u}/rest/v1/${t}?${f}=eq.${v}&select=*`,{headers:{apikey:k,Authorization:`Bearer ${k}`,Accept:'application/vnd.pgrst.object+json'}}).then(r=>r.json().then(d=>({data:r.ok?d:null,error:r.ok?null:d})))}}}}},insert:function(v){return{select:function(){return{single:function(){return fetch(`${u}/rest/v1/${t}`,{method:'POST',headers:{apikey:k,Authorization:`Bearer ${k}`,'Content-Type':'application/json',Prefer:'return=representation' },body:JSON.stringify(v)}).then(r=>r.json().then(d=>({data:r.ok?d:null,error:r.ok?null:d})))}}}}},update:function(v){return{eq:function(f,id){return fetch(`${u}/rest/v1/${t}?${f}=eq.${id}`,{method:'PATCH',headers:{apikey:k,Authorization:`Bearer ${k}`,'Content-Type':'application/json'},body:JSON.stringify(v)}).then(r=>({error:r.ok?null:r}))}}},order:function(c,o){return{eq:function(f,v){return fetch(`${u}/rest/v1/${t}?${f}=eq.${v}&select=*&order=${c}.${o.ascending?'asc':'desc'}`,{headers:{apikey:k,Authorization:`Bearer ${k}`}}).then(r=>r.json().then(d=>({data:r.ok?d:null,error:r.ok?null:d})))}}}}}}};})));
    </script>
    <style>
        :root { --tg-blue: #248bcf; --tg-bg: #f4f4f5; --tg-sent: #effdde; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; background: var(--tg-bg); overflow: hidden; }
        #auth-screen { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #517da2, #248bcf); }
        .auth-box { width: 340px; background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
        .tg-input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; outline: none; font-size: 16px; }
        .tg-btn { width: 100%; padding: 14px; background: var(--tg-blue); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        #main-app { display: none; height: 100vh; grid-template-columns: 300px 1fr; background: white; }
        .sidebar { border-right: 1px solid #ddd; display: flex; flex-direction: column; background: #fff; }
        .sidebar-header { padding: 15px; background: var(--tg-blue); color: white; display: flex; align-items: center; gap: 10px; }
        .avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; background: #999; flex-shrink: 0; }
        .chat-area { display: flex; flex-direction: column; background: #e7ebf0 url('https://githubusercontent.com'); }
        #messages-view { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        .msg-bubble { max-width: 75%; padding: 10px 14px; border-radius: 15px; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg-bubble.sent { align-self: flex-end; background: #effdde; }
        .chat-footer { padding: 15px; background: white; display: flex; gap: 10px; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h2 id="auth-title">登录 Cloud Telegram</h2>
        <p style="color:#666; font-size:14px">账号将永久加密保存于云端</p>
        <input type="text" id="u-name" class="tg-input" placeholder="用户名">
        <input type="password" id="u-pwd" class="tg-input" placeholder="密码">
        <button class="tg-btn" onclick="handleAuth()">进入聊天室</button>
        <span id="auth-switch" style="font-size:13px; color:#248bcf; cursor:pointer; display:block; margin-top:15px" onclick="toggleMode()">没有账号？点击注册</span>
        <div id="auth-tips" style="margin-top:15px; font-size:12px; color:#888"></div>
    </div>
</div>

<div id="main-app">
    <div class="sidebar">
        <div class="sidebar-header">
            <div id="my-av" class="avatar" style="cursor:pointer" onclick="changeAv()">?</div>
            <div id="my-name" style="font-weight:bold">载入中...</div>
            <button onclick="localStorage.clear();location.reload()" style="background:none;border:none;color:white;cursor:pointer;font-size:11px;margin-left:auto">退出</button>
        </div>
        <div id="contacts-list" style="overflow-y:auto; flex:1"></div>
    </div>
    <div class="chat-area">
        <div style="padding:12px 20px; background:white; border-bottom:1px solid #ddd; font-weight:bold" id="t-name">选择联系人</div>
        <div id="messages-view"></div>
        <div class="chat-footer">
            <input type="text" id="msg-ipt" class="tg-input" style="margin:0" placeholder="写消息...">
            <button class="tg-btn" style="width:80px; margin:0" onclick="send()">发送</button>
        </div>
    </div>
</div>

<script>
    // --- ✅ 已经为你填好了专属 URL 和 KEY ---
    const const URL = 'https://azgyqygryealifnxinjk.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6Z3lxeWdyeWVhbGlmbnhpbmprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjk4MzcsImV4cCI6MjA5MzgwNTgzN30.2_coqJbBl95QcnollMK2F2JSPJXexIkwy4rpiaH8EYc';
    const _s = supabase.createClient(URL, KEY);
    const colors = ['#E57373', '#81C784', '#64B5F6', '#FFB74D', '#BA68C8', '#4DB6AC', '#FF8A65', '#90A4AE'];

    let me = null, target = 'PUBLIC_DOMAIN', isReg = false;

    function toggleMode() {
        isReg = !isReg;
        document.getElementById('auth-title').innerText = isReg ? "注册 Cloud Telegram" : "登录 Cloud Telegram";
        document.getElementById('auth-switch').innerText = isReg ? "已有账号？点击登录" : "没有账号？点击注册";
    }

    async function handleAuth() {
        const name = document.getElementById('u-name').value.trim();
        const pwd = document.getElementById('u-pwd').value.trim();
        const tips = document.getElementById('auth-tips');
        if(!name || !pwd) return alert("请填写完整");

        tips.innerText = "⚡ 正在尝试云端连接...";
        try {
            // 获取用户数据
            let { data: users } = await _s.from('users').select('*').eq('username', name);
            let u = users && users[0];

            if (isReg) {
                if (u) { tips.innerText = "❌ 账号已存在"; return; }
                const { data: n } = await _s.from('users').insert([{ username: name, password: pwd, avatar_index: Math.floor(Math.random()*8) }]).select().single();
                me = n;
            } else {
                if (!u) { tips.innerText = "❌ 账号不存在，请先注册"; return; }
                if (u.password !== pwd) { tips.innerText = "❌ 密码错误"; return; }
                me = u;
            }
            localStorage.setItem('tg_pro_user', JSON.stringify(me));
            startApp();
        } catch(e) { tips.innerText = "❌ 连接异常，请检查 URL 配置或换网刷新"; console.error(e); }
    }

    function startApp() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'grid';
        document.getElementById('my-name').innerText = me.username;
        document.getElementById('my-av').innerText = me.username.charAt(0).toUpperCase();
        document.getElementById('my-av').style.background = colors[me.avatar_index % 8];
        sync(); setInterval(sync, 3000);
    }

    async function sync() {
        if(!me) return;
        // 同步联系人
        const { data: us } = await _s.from('users').select('*').neq('username', me.username);
        let h = `<div style="padding:12px; cursor:pointer; border-bottom:1px solid #eee; ${target==='PUBLIC_DOMAIN'?'background:#e3f2fd':''}" onclick="setT('PUBLIC_DOMAIN','公共大群',0)"><b>公共大群</b></div>`;
        us?.forEach(u => {
            h += `<div style="padding:12px; cursor:pointer; border-bottom:1px solid #eee; ${target===u.username?'background:#e3f2fd':''}" onclick="setT('${u.username}','${u.username}',${u.avatar_index})">${u.username}</div>`;
        });
        document.getElementById('contacts-list').innerHTML = h;

        // 同步消息
        const room = target === 'PUBLIC_DOMAIN' ? 'PUBLIC_DOMAIN' : [me.username, target].sort().join('_VS_');
        const { data: ms } = await _s.from('messages').select('*').eq('room_id', room).order('created_at', {ascending:true});
        if(!window.rIds) window.rIds = new Set();
        ms?.forEach(m => {
            if(!window.rIds.has(m.id)) {
                const v = document.getElementById('messages-view');
                const d = document.createElement('div');
                d.className = `msg-bubble ${m.username===me.username?'sent':''}`;
                d.innerHTML = `<div style="font-size:10px;font-weight:bold;color:#517da2">${m.username}</div>${m.content}`;
                v.appendChild(d);
                v.scrollTop = 99999;
                window.rIds.add(m.id);
            }
        });
    }

    function setT(id, name, idx) {
        target = id; document.getElementById('t-name').innerText = name;
        document.getElementById('messages-view').innerHTML = ''; window.rIds = new Set(); sync();
    }

    async function send() {
        const i = document.getElementById('msg-ipt');
        if(!i.value.trim()) return;
        const room = target === 'PUBLIC_DOMAIN' ? 'PUBLIC_DOMAIN' : [me.username, target].sort().join('_VS_');
        await _s.from('messages').insert([{ username: me.username, content: i.value, room_id: room }]);
        i.value = ''; sync();
    }

    async function changeAv() {
        const idx = Math.floor(Math.random()*8);
        await _s.from('users').update({ avatar_index: idx }).eq('id', me.id);
        me.avatar_index = idx; location.reload();
    }

    window.onload = () => { const s = localStorage.getItem('tg_pro_user'); if(s) { me = JSON.parse(s); startApp(); } };
    document.getElementById('msg-ipt').onkeypress = e => e.key==='Enter' && send();
</script>
</body>
</html>
