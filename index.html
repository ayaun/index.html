<script>
    const URL = 'https://supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6Z3lxeWdyeWVhbGlmbnhpbmprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjk4MzcsImV4cCI6MjA5MzgwNTgzN30.2_coqJbBl95QcnollMK2F2JSPJXexIkwy4rpiaH8EYc';
    
    const _s = supabase.createClient(URL, KEY);
    
    // 强制弹出昵称框
    let user = localStorage.getItem('user') || prompt("欢迎！请输入聊天昵称") || "访客";
    localStorage.setItem('user', user);
    document.getElementById('status').innerText = "✅ 已连接: " + user;

    async function load() {
        console.log("尝试加载数据...");
        const { data, error } = await _s.from('messages').select('*').order('created_at');
        if (error) {
            console.error(error);
            document.getElementById('status').innerText = "❌ 数据库报错: " + error.message;
        } else if (data) {
            data.forEach(m => add(m));
        }
    }

    function add(m) {
        const d = document.createElement('div');
        d.style = "background:white; padding:10px; border-radius:10px; margin:5px; align-self:flex-start; max-width:70%;";
        d.innerText = m.username + ": " + m.content;
        document.getElementById('chat').appendChild(d);
        document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }

    async function send() {
        const i = document.getElementById('ipt');
        const v = i.value.trim(); 
        if(!v) return;
        i.value = '';
        // 发送时如果不成功会弹窗提示
        const { error } = await _s.from('messages').insert([{ username: user, content: v }]);
        if (error) alert("发送失败: " + error.message);
    }

    _s.channel('m').on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, p => add(p.new)).subscribe();
    document.getElementById('ipt').addEventListener('keypress', e => { if(e.key === 'Enter') send(); });
    load();
</script>
