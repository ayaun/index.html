<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Telegram Pro - 终极版</title>
    <!-- 加载 Supabase 核心库 -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --tg-blue: #248bcf; --tg-bg: #f4f4f5; --tg-sent: #effdde; --sidebar-w: 300px; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--tg-bg); overflow: hidden; }
        
        /* 完善后的全屏登录页面 */
        #login-screen { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #517da2 0%, #248bcf 100%); transition: 0.5s; }
        .login-box { width: 340px; background: white; padding: 40px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; }
        .login-logo { width: 70px; height: 70px; background: var(--tg-blue); border-radius: 22px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(36,139,207,0.3); }
        .tg-input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #e0e0e0; border-radius: 12px; box-sizing: border-box; outline: none; font-size: 16px; transition: 0.3s; }
        .tg-input:focus { border-color: var(--tg-blue); box-shadow: 0 0 0 3px rgba(36, 139, 207, 0.1); }
        .tg-btn { width: 100%; padding: 14px; background: var(--tg-blue); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .tg-btn:hover { background: #1c74ad; }
        #login-tips { font-size: 13px; margin-top: 15px; color: #666; min-height: 1.2em; }

        /* 主界面布局 */
        #main-app { display: none; height: 100vh; grid-template-columns: var(--sidebar-w) 1fr; background: #fff; }
        .sidebar { border-right: 1px solid #e6e6e6; display: flex; flex-direction: column; background: #fff; }
        .sidebar-header { padding: 15px; background: var(--tg-blue); color: white; display: flex; align-items: center; gap: 12px; }
        .user-list { flex: 1; overflow-y: auto; }
        
        /* 联系人项样式 */
        .contact-item { padding: 12px 15px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid #f9f9f9; transition: 0.2s; }
        .contact-item:hover { background: #f5f5f5; }
        .contact-item.active { background: #eff7ff; border-left: 4px solid var(--tg-blue); }
        
        /* 头像系统 */
        .avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; flex-shrink: 0; text-transform: uppercase; }
        
        /* 聊天区样式 */
        .chat-area { display: flex; flex-direction: column; background: #e7ebf0 url('https://githubusercontent.com'); }
        .chat-header { padding: 10px 20px; background: white; border-bottom: 1px solid #ddd; display: flex; align-items: center; gap: 12px; font-weight: bold; height: 50px; }
        #messages-view { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        
        /* 消息气泡 */
        .msg-bubble { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); line-height: 1.4; word-wrap: break-word; }
        .msg-bubble.sent { align-self: flex-end; background: #effdde; border-bottom-right-radius: 4px; }
        .msg-bubble.received { align-self: flex-start; background: white; border-bottom-left-radius: 4px; }
        .msg-user { font-size: 11px; font-weight: bold; color: var(--tg-blue); margin-bottom: 3px; }
        
        .chat-footer { padding: 15px; background: white; display: flex; gap: 12px; border-top: 1px solid #ddd; }
    </style>
</head>
<body>

    <!-- 1. 登录与注册遮罩层 -->
    <div id="login-screen">
        <div class="login-box">
            <div class="login-logo">
                <!-- Telegram 风格图标 -->
                <svg width="40" height="40" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.91-1.27 4.85-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
            </div>
            <h2 style="margin:0; color:#333">Cloud Telegram Pro</h2>
            <p style="color:#888; font-size:14px; margin:10px 0 25px">登录以永久保留你的聊天账号</p>
            
            <input type="text" id="login-username" class="tg-input" placeholder="输入用户名">
            <input type="password" id="login-password" class="tg-input" placeholder="输入密码">
            
            <button class="tg-btn" onclick="handleAuth()">进入聊天室</button>
            <div id="login-tips">初次使用输入账号即完成注册</div>
        </div>
    </div>

    <!-- 2. 主应用程序 -->
    <div id="main-app">
        <!-- 左侧侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div id="my-avatar-view" class="avatar" style="cursor:pointer; border:2px solid rgba(255,255,255,0.3)">?</div>
                <div style="flex:1">
                    <div id="my-name-view" style="font-weight:bold; font-size:16px">正在同步...</div>
                    <div style="font-size:11px; opacity:0.8">24H 云端在线</div>
                </div>
                <button onclick="logout()" style="background:none; border:none; color:white; font-size:12px; cursor:pointer; opacity:0.7">退出</button>
            </div>
            
            <!-- 好友/群组列表 -->
            <div class="user-list" id="contact-list-view">
                <!-- 列表由 JS 动态生成 -->
            </div>
        </div>

        <!-- 右侧聊天区域 -->
        <div class="chat-area">
            <div class="chat-header">
                <div id="target-avatar-view" class="avatar" style="width:34px; height:34px; font-size:14px">?</div>
                <div id="target-name-view">选择一个联系人</div>
            </div>
            
            <!-- 消息显示窗口 -->
            <div id="messages-view">
                <!-- 消息内容 -->
            </div>

            <!-- 输入区域 -->
            <div class="chat-footer">
                <input type="text" id="chat-input" class="tg-input" style="margin:0" placeholder="写消息..." autocomplete="off">
                <button class="tg-btn" style="width:80px; margin:0" onclick="performSend()">发送</button>
            </div>
        </div>
    </div>
    <script>
        // --- 1. 云端核心配置 ---
        const URL = 'https://azgyqygryealifnxinjk.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6Z3lxeWdyeWVhbGlmbnhpbmprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjk4MzcsImV4cCI6MjA5MzgwNTgzN30.2_coqJbBl95QcnollMK2F2JSPJXexIkwy4rpiaH8EYc';
        const _s = supabase.createClient(URL, KEY);
        const avatarColors = ['#E57373', '#81C784', '#64B5F6', '#FFB74D', '#BA68C8'];

        let currentUser = null; // 当前登录的用户信息
        let activeTarget = 'PUBLIC_GROUP'; // 当前选中的聊天对象

        // --- 2. 身份验证逻辑 (登录/注册) ---
        async function handleAuth() {
            const user = document.getElementById('login-username').value.trim();
            const pwd = document.getElementById('login-password').value.trim();
            const tips = document.getElementById('login-tips');

            if (!user || !pwd) { alert("账号密码不能为空"); return; }
            tips.innerText = "⚡ 正在同步云端身份...";

            // 尝试在云端查找该账号
            let { data: u } = await _s.from('users').select('*').eq('username', user).maybeSingle();

            if (u) {
                // 如果存在，校验密码
                if (u.password !== pwd) {
                    tips.innerText = "❌ 密码错误，请重试";
                    tips.style.color = 'red';
                    return;
                }
                currentUser = u;
            } else {
                // 如果不存在，自动创建新账号 (注册)
                const { data: newUser, error: regErr } = await _s.from('users').insert([
                    { username: user, password: pwd, avatar_index: Math.floor(Math.random() * 5) }
                ]).select().single();
                
                if (regErr) { tips.innerText = "注册失败，请检查网络"; return; }
                currentUser = newUser;
            }

            // 保存登录状态到本地 (下次免登录)
            localStorage.setItem('tg_pro_user', JSON.stringify(currentUser));
            enterApp();
        }

        // 退出登录
        function logout() {
            localStorage.removeItem('tg_pro_user');
            location.reload();
        }

        // 进入主界面
        function enterApp() {
            document.getElementById('login-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'grid';
                startSync(); // 开启同步引擎
            }, 500);
        }
        // --- 3. 核心应用引擎 (同步与渲染) ---
        function startSync() {
            // 渲染我的个人信息
            const myNameView = document.getElementById('my-name-view');
            const myAvView = document.getElementById('my-avatar-view');
            myNameView.innerText = currentUser.username;
            myAvView.innerText = currentUser.username.charAt(0).toUpperCase();
            myAvView.style.background = avatarColors[currentUser.avatar_index];

            // 初始加载
            refreshContacts();
            syncMessages();

            // 开启定时任务
            setInterval(refreshContacts, 5000); // 5秒刷新一次联系人列表
            setInterval(syncMessages, 3000);    // 3秒同步一次消息
        }

        // 刷新联系人列表
        async function refreshContacts() {
            const { data: users } = await _s.from('users').select('*').neq('username', currentUser.username);
            const listContainer = document.getElementById('contact-list-view');
            
            // 默认添加公共大群
            let html = `
                <div class="contact-item ${activeTarget === 'PUBLIC_GROUP' ? 'active' : ''}" onclick="switchChat('PUBLIC_GROUP', '公共大群', '#f39c12')">
                    <div class="avatar" style="background:#f39c12">G</div>
                    <div style="flex:1">
                        <div style="font-weight:bold">公共大群</div>
                        <div style="font-size:11px; color:#888">大家都在这里</div>
                    </div>
                </div>
            `;

            // 循环渲染所有发现的云端用户
            users?.forEach(u => {
                const color = avatarColors[u.avatar_index];
                html += `
                    <div class="contact-item ${activeTarget === u.username ? 'active' : ''}" onclick="switchChat('${u.username}', '${u.username}', '${color}')">
                        <div class="avatar" style="background:${color}">${u.username.charAt(0).toUpperCase()}</div>
                        <div style="flex:1">
                            <div style="font-weight:bold">${u.username}</div>
                            <div style="font-size:11px; color:#888">点击开始私聊</div>
                        </div>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        // 切换聊天目标
        function switchChat(id, name, color) {
            activeTarget = id;
            const headerName = document.getElementById('target-name-view');
            const headerAv = document.getElementById('target-avatar-view');
            
            headerName.innerText = name;
            headerAv.innerText = name.charAt(0).toUpperCase();
            headerAv.style.background = color;
            
            // 清空旧消息并重置渲染记录
            document.getElementById('messages-view').innerHTML = '';
            window.renderedIds = new Set();
            
            refreshContacts(); // 刷新左侧选中状态
            syncMessages();    // 立即尝试同步一次
        }

        // 计算唯一的房间 ID (区分私聊和公聊)
        function getRoomId() {
            if (activeTarget === 'PUBLIC_GROUP') return 'PUBLIC_DOMAIN';
            // 将两个人的名字按字母排序后组合，确保唯一性
            return [currentUser.username, activeTarget].sort().join('_VS_');
        }
        // --- 4. 消息同步与显示 ---
        async function syncMessages() {
            if (!currentUser || !activeTarget) return;
            const currentRoom = getRoomId();

            // 从云端获取属于当前房间的消息
            const { data: msgs, error } = await _s.from('messages')
                .select('*')
                .eq('room_id', currentRoom)
                .order('created_at', { ascending: true });

            if (error) return;

            const view = document.getElementById('messages-view');
            if (!window.renderedIds) window.renderedIds = new Set();

            msgs?.forEach(m => {
                // 使用数据库 ID 防止重复显示
                if (!window.renderedIds.has(m.id)) {
                    const isMe = m.username === currentUser.username;
                    const div = document.createElement('div');
                    div.className = `msg-bubble ${isMe ? 'sent' : 'received'}`;
                    
                    div.innerHTML = `
                        <div class="msg-user">${m.username}</div>
                        <div>${m.content}</div>
                    `;
                    view.appendChild(div);
                    view.scrollTop = view.scrollHeight; // 自动滚到底部
                    window.renderedIds.add(m.id);
                }
            });
        }

        // --- 5. 发送消息逻辑 ---
        window.performSend = async function() {
            const input = document.getElementById('chat-input');
            const val = input.value.trim();
            if (!val || !currentUser) return;

            const currentRoom = getRoomId();
            input.value = ''; // 清空输入框

            // 存入云端
            const { error } = await _s.from('messages').insert([
                { 
                    username: currentUser.username, 
                    content: val, 
                    room_id: currentRoom 
                }
            ]);

            if (error) alert("发送失败，请检查网络");
            else syncMessages(); // 立即刷新
        };

        // --- 6. 自动化绑定与初始化 ---
        // 绑定回车键
        document.getElementById('chat-input').addEventListener('keypress', e => {
            if (e.key === 'Enter') performSend();
        });

        // 【核心功能】：自动登录检测
        window.onload = () => {
            const savedUser = localStorage.getItem('tg_pro_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                enterApp(); // 如果本地有账号，跳过登录直接进入
            }
        };
    </script>
</body>
</html>
